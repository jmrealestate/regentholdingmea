<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Business | Regent Holding MEA</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="inner">
  <header class="site-header solid">
    <a href="index.html" id="logo" class="logo"></a>
    <button class="nav-toggle" aria-label="Menu">☰</button>
    <nav class="nav">
      <a href="index.html#brands">← All Brands</a>
      <a href="#gallery-section">Gallery</a>
      <a href="#reviews">Reviews</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section id="hero" class="hero short">
    <div class="hero-text"><small></small><h1></h1><p></p></div>
  </section>

  <section class="section">
    <div class="wrap two">
      <div id="desc" class="prose"></div>
      <div id="highlights" class="highlights"></div>
    </div>
  </section>

  <section id="gallery-section" class="section alt">
    <div class="head"><h2>Gallery</h2></div>
    <div id="gallery" class="gallery"></div>
  </section>

  <section id="reviews" class="section">
    <div class="head"><h2>Reviews</h2></div>
    <div id="review-grid" class="review-grid"></div>
  </section>

  <section id="contact" class="section alt">
    <div class="wrap narrow">
      <h2>Contact</h2><div id="contact-info"></div>
    </div>
  </section>

  <section class="section">
    <div class="head"><h2>Our Other Brands</h2></div>
    <div id="other-brands" class="brand-grid small"></div>
  </section>

  <footer class="footer"><p id="copy"></p></footer>

  <div id="lightbox" class="lightbox">
    <button class="prev" aria-label="Previous">‹</button>
    <figure><img alt=""><figcaption></figcaption></figure>
    <button class="next" aria-label="Next">›</button>
  </div>

  <script src="js/common.js"></script>
  <script src="js/business.js"></script>
</body>
</html>
